<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>axl</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 4rem auto; padding: 0 1rem; }
    form { display: flex; gap: .5rem; }
    input { flex: 1; padding: .6rem; font-size: 1rem; }
    button { padding: .6rem 1rem; font-size: 1rem; cursor: pointer; }
    button:disabled { cursor: wait; opacity: .6; }
    #result { margin-top: 1.5rem; }
    .error { color: #c0392b; }
  </style>
</head>
<body>
  <h1>axl</h1>
  <form id="form">
    <input id="url" type="url" placeholder="https://example.com/some/long/path" required />
    <button type="submit">Shorten</button>
  </form>
  <div id="result"></div>

  <script>
    const form = document.getElementById('form');
    const input = document.getElementById('url');
    const button = form.querySelector('button');
    const result = document.getElementById('result');

    // The server dedupes plain links, so a URL always maps to the same short link.
    // Remembering answers here means repeat submits never leave the browser.
    const STORAGE_KEY = 'axl:links';
    const cache = new Map(loadCache());

    function loadCache() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) ?? [];
      } catch {
        return [];
      }
    }

    function saveCache() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify([...cache]));
      } catch {
        // Storage unavailable (private mode, quota): the in-memory cache still works.
      }
    }

    // Same normalization the server applies, so "https://GitHub.com" and
    // "https://github.com/" share one cache entry.
    function cacheKey(value) {
      try {
        return new URL(value.trim()).toString();
      } catch {
        return null;
      }
    }

    function showLink(shortUrl) {
      result.textContent = '';
      const link = document.createElement('a');
      link.href = shortUrl;
      link.textContent = shortUrl;
      const copy = document.createElement('button');
      copy.type = 'button';
      copy.textContent = 'Copy';
      copy.onclick = () => navigator.clipboard.writeText(shortUrl);
      result.append(link, ' ', copy);
    }

    function showError(message) {
      result.textContent = '';
      const p = document.createElement('p');
      p.className = 'error';
      p.textContent = message;
      result.append(p);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (button.disabled) return;

      const key = cacheKey(input.value);
      if (key && cache.has(key)) {
        showLink(cache.get(key));
        return;
      }

      button.disabled = true;
      try {
        const res = await fetch('/api/links', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: input.value.trim() }),
        });
        const data = await res.json();

        if (res.status === 429) {
          const wait = res.headers.get('retry-after');
          showError(`Too many links created. Try again${wait ? ` in ${wait}s` : ' in a minute'}.`);
          return;
        }
        if (!res.ok) {
          showError(data.error ?? 'Something went wrong');
          return;
        }

        cache.set(key ?? data.longUrl, data.shortUrl);
        saveCache();
        showLink(data.shortUrl);
      } catch {
        showError('Could not reach the server');
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
